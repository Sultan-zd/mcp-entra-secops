server:
  port: 7998
  # Le navigateur ne doit jamais recevoir la trace d'une exception : elle nomme
  # des classes et des chemins de fichiers. ApiExceptionHandler rend un message
  # choisi à la place.
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: argus-web
  threads:
    # Un fil virtuel par requête. Un appel d'outil MCP passe l'essentiel de son
    # temps à attendre le DNS ou une API distante : bloquer un fil de plateforme
    # pendant ce temps limiterait inutilement le nombre d'analyses simultanées.
    virtual:
      enabled: true

argus:
  # À activer uniquement derrière un mandataire de confiance. Sinon, n'importe
  # qui contournerait la limitation de débit en inventant un X-Forwarded-For.
  derriere-mandataire: false

  ratelimit:
    analyse:
      capacite: 10
      recharge-par-minute: 5

  mcp:
    # DOIT être le Python de l'environnement où le paquet ARGUS est installé.
    # Surchargeable par la variable d'environnement ARGUS_MCP_PYTHON.
    python: python
    pool-size: 2
    request-timeout: 30s
    startup-timeout: 45s
    borrow-timeout: 20s

    servers:
      email:
        label: Messagerie ARGUS
        transport: stdio
        module: email_security_mcp
        env:
          MAIL_DATA_SOURCE: live
        # Liste d'autorisation explicite. Un outil ajouté côté Python ne devient
        # pas exposé sur le web tant qu'il n'est pas nommé ici.
        allowed-tools:
          - check_domain_posture
          - check_spf
          - check_dmarc
          - check_dkim
          - analyze_email_headers

      # Serveur MCP tiers, sans clé : 55 outils de renseignement sur les
      # vulnérabilités, MITRE, Sigma, DNS/SSL et réputation.
      #
      # Il est DISTANT : les arguments sont filtrés avant de partir. Une
      # adresse interne envoyée à un service de réputation ne rend rien
      # d'utile et révélerait la topologie du réseau — la règle qu'ARGUS
      # applique déjà côté Python est rejouée ici.
      contrast:
        label: ContrastAPI
        transport: http
        url: https://api.contrastcyber.com
        endpoint: /mcp/
        remote: true
        # Cinquante-cinq outils : la liste nominative serait impraticable.
        # L'ouverture reste une décision explicite, pas un défaut.
        allow-all-tools: true

logging:
  level:
    com.teknologiia.argus: INFO
