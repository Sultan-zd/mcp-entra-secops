[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entra-secops-mcp"
version = "0.1.0"
description = "Serveur MCP exposant les journaux de sécurité Microsoft Entra ID comme outils exécutables pour un agent IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "entra-id", "azure", "secops", "microsoft-graph"]

dependencies = [
    # API MCPServer (SDK 2.x). L'ancienne API FastMCP du SDK 1.x n'existe plus.
    "mcp>=2.0",
    "httpx>=0.27",
    "azure-identity>=1.19",
    # Transport asynchrone requis par azure-core pour azure.identity.aio :
    # sans lui, l'obtention du jeton échoue à l'import.
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
entra-secops-mcp = "entra_secops_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/entra_secops_mcp"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*", "azure.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
