[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-secops"
version = "0.6.0"
description = "Plateforme SecOps agentique : serveurs MCP d'identité, de renseignement sur les menaces et de sécurité de la messagerie"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "entra-id", "azure", "secops", "threat-intelligence", "virustotal"]

dependencies = [
    # API MCPServer (SDK 2.x). L'ancienne API FastMCP du SDK 1.x n'existe plus.
    "mcp>=2.0",
    "httpx>=0.27",
    "azure-identity>=1.19",
    # Transport asynchrone requis par azure-core pour azure.identity.aio :
    # sans lui, l'obtention du jeton échoue à l'import.
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Resolution DNS asynchrone : SPF, DKIM et DMARC sont publies dans le DNS.
    "dnspython>=2.7",
]

[project.optional-dependencies]
# Cache partage entre processus. Sans cette extra, le serveur utilise un
# cache en memoire : suffisant pour un poste de travail, insuffisant des que
# plusieurs instances tournent en parallele.
cache = ["redis>=5.0"]
# Console analyste. Optionnelle : les serveurs MCP et l'agent fonctionnent
# sans elle, et la CI n'a pas besoin d'un serveur web pour valider le reste.
console = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
entra-secops-mcp = "entra_secops_mcp.__main__:main"
threat-intel-mcp = "threat_intel_mcp.__main__:main"
email-security-mcp = "email_security_mcp.__main__:main"
argus-agent = "argus_agent.__main__:main"
argus-eval = "argus_eval.__main__:main"
argus-console = "argus_console.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/entra_secops_mcp",
    "src/threat_intel_mcp",
    "src/email_security_mcp",
    "src/argus_agent",
    "src/argus_eval",
    "src/argus_obs",
    "src/argus_console",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*", "azure.*", "redis.*", "dns.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
