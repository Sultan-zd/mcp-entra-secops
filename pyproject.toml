[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-secops"
version = "1.0.0"
description = "Plateforme SecOps agentique : serveurs MCP d'identité, de renseignement sur les menaces et de sécurité de la messagerie"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "entra-id", "azure", "secops", "threat-intelligence", "virustotal"]

dependencies = [
    # API MCPServer (SDK 2.x). L'ancienne API FastMCP du SDK 1.x n'existe plus.
    "mcp>=2.0",
    "httpx>=0.27",
    "azure-identity>=1.19",
    # Transport asynchrone requis par azure-core pour azure.identity.aio :
    # sans lui, l'obtention du jeton échoue à l'import.
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Resolution DNS asynchrone : SPF, DKIM et DMARC sont publies dans le DNS.
    "dnspython>=2.7",
    # Lecture des certificats X.509 : le module `ssl` ne rend aucun champ
    # quand la verification est desactivee, ce qui est precisement le mode
    # ou l'on veut inspecter un certificat expire ou auto-signe.
    "cryptography>=42.0",
    # Analyse et conversion des regles Sigma. La specification comporte des
    # dizaines de modificateurs : une reimplementation maison produirait des
    # regles qui paraissent correctes et ratent silencieusement les attaques.
    # L'API a change entre pySigma 0.x et 1.x : le plancher est la version
    # contre laquelle le code est verifie, pas la plus ancienne qui s'installe.
    "pysigma>=1.5",
    "pysigma-backend-kusto>=1.0",
    "pysigma-backend-splunk>=2.1",
    "pysigma-backend-elasticsearch>=2.1",
    # Lecture de la structure brute d'une regle. Arrive avec pysigma, mais ce
    # module l'importe directement : une dependance transitive peut disparaitre
    # sans preavis.
    "PyYAML>=6.0",
    # Analyse de regles YARA. plyara lit la structure (tolerante par endroits,
    # stricte a d'autres, verifie en testant) ; yara-python (compilateur
    # officiel) juge de la conformite reelle.
    "plyara>=2.2",
    "yara-python>=4.5",
]

[project.optional-dependencies]
# Cache partage entre processus. Sans cette extra, le serveur utilise un
# cache en memoire : suffisant pour un poste de travail, insuffisant des que
# plusieurs instances tournent en parallele.
cache = ["redis>=5.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
entra-secops-mcp = "entra_secops_mcp.__main__:main"
threat-intel-mcp = "threat_intel_mcp.__main__:main"
email-security-mcp = "email_security_mcp.__main__:main"
vuln-intel-mcp = "vuln_intel_mcp.__main__:main"
mitre-attack-mcp = "mitre_mcp.__main__:main"
detection-mcp = "detection_mcp.__main__:main"
artefact-mcp = "artefact_mcp.__main__:main"
web-recon-mcp = "web_recon_mcp.__main__:main"
argus-mcp = "argus_bundle.__main__:main"
argus-agent = "argus_agent.__main__:main"
argus-eval = "argus_eval.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
    # --- src/ : LE PRODUIT ----------------------------------------------
    # Ces neuf paquets, et eux seuls, partent dans l'extension .mcpb. La
    # liste est doublee dans mcpb/outils/synchroniser_mcpb.py, qui fait foi
    # pour la construction ; un test verifie qu'elles ne divergent pas.
    "src/entra_secops_mcp",
    "src/threat_intel_mcp",
    "src/email_security_mcp",
    "src/argus_net",
    "src/vuln_intel_mcp",
    "src/mitre_mcp",
    "src/detection_mcp",
    "src/artefact_mcp",
    "src/web_recon_mcp",
    "src/argus_bundle",
    # --- atelier/ : HORS PAQUET ------------------------------------------
    # Outillage de developpement et de validation. Jamais distribue : quand
    # un analyste installe l'extension, c'est SON modele qui enchaine les
    # outils, l'orchestrateur programmatique ne lui sert a rien.
    "atelier/argus_agent",
    "atelier/argus_eval",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "atelier", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# L'outillage de construction lance des commandes ecrites en dur dans le
# fichier lui-meme, jamais une entree utilisateur.
"mcpb/outils/*" = ["S603"]
# S314 : les scripts de distillation analysent du XML/JSON telecharge depuis
# des sources officielles de premiere partie (MITRE), jamais une entree
# utilisateur — le risque que S314 signale ne s'applique pas ici.
"scripts/*" = ["S603", "S314"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*", "azure.*", "redis.*", "dns.*", "sigma.*", "plyara.*", "yara.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
