name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Une nouvelle poussée annule la précédente exécution sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types et tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installer le projet et ses dépendances de développement
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Types (mypy strict)
        run: mypy src

      - name: Tests (pytest)
        run: pytest
        env:
          # Aucun identifiant ni clé d'API n'est nécessaire : la suite est
          # hermétique et n'atteint jamais le réseau.
          ENTRA_DATA_SOURCE: fixture
          TI_DATA_SOURCE: fixture

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks inspecte l'historique complet, pas seulement le dernier
          # commit : un secret retiré reste exploitable tant qu'il est dans
          # l'historique.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: qualite

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t entra-secops-mcp:ci .

      - name: Vérifier que le conteneur démarre et répond en MCP
        run: |
          python -m pip install --quiet "mcp>=2.0"
          python - <<'PY'
          import asyncio, os, sys
          from mcp import Client, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main() -> None:
              params = StdioServerParameters(
                  command="docker",
                  args=[
                      "run", "-i", "--rm",
                      "-e", "ENTRA_DATA_SOURCE=fixture",
                      "entra-secops-mcp:ci",
                  ],
                  env=dict(os.environ),
              )
              async with Client(stdio_client(params), raise_exceptions=True) as client:
                  outils = [t.name for t in (await client.list_tools()).tools]
                  print("outils exposés :", outils)
                  assert len(outils) == 6, f"6 outils attendus, {len(outils)} trouvés"

                  res = await client.call_tool(
                      "get_user_signins", {"upn": "marketing@teknologiia.com"}
                  )
                  assert not res.is_error, "l'appel d'outil a échoué"
                  assert res.structured_content["failures"] > 0
                  print("appel d'outil dans le conteneur : OK")

          asyncio.run(main())
          PY

      # Rapport complet, non bloquant : il documente ce qui a été trouvé, y
      # compris les vulnérabilités sans correctif disponible en amont.
      - name: Inventaire des vulnérabilités (rapport)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Le dépôt par défaut (ghcr.io) limite les tirages non authentifiés,
          # ce qui fait échouer l'étape pour une raison sans rapport avec la
          # sécurité de l'image. Le miroir AWS n'impose pas cette limite.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: entra-secops-mcp:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

      # Garde-fou bloquant. Le seuil est CRITICAL et non HIGH, et seules les
      # vulnérabilités CORRIGEABLES comptent : bloquer sur une faille dont
      # l'amont n'a pas encore publié le correctif rendrait la CI rouge en
      # permanence, sans qu'aucune action ne puisse la faire repasser au vert.
      # Une CI durablement rouge finit par être ignorée — elle protège alors
      # moins bien qu'un seuil plus étroit mais respecté.
      - name: Garde-fou vulnérabilités critiques
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        with:
          image-ref: entra-secops-mcp:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
