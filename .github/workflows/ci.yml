name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Une nouvelle poussée annule la précédente exécution sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types et tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Installer le projet et ses dépendances de développement
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Types (mypy strict)
        run: mypy src

      - name: Tests (pytest)
        # `-rs` : un test ignoré doit apparaître dans le rapport. Une suite
        # verte dont la moitié est en `skip` ne prouve rien.
        run: pytest -q -rs
        env:
          # Aucun identifiant ni clé d'API n'est nécessaire : la suite est
          # hermétique et n'atteint jamais le réseau.
          ENTRA_DATA_SOURCE: fixture
          TI_DATA_SOURCE: fixture
          MAIL_DATA_SOURCE: fixture

      # Le harnais d'évaluation est un garde-fou, pas un affichage : il sort
      # en erreur dès qu'un seuil bloquant est dépassé. Les deux seuils qui
      # arrêtent la chaîne portent sur les erreurs à coût asymétrique —
      # laisser passer un incident réel, et se laisser manipuler par une
      # donnée d'entrée.
      - name: Évaluation de l'agent (jeu de référence)
        run: argus-eval --verbose

      - name: Conserver le rapport d'évaluation
        if: always()
        run: argus-eval --json > rapport-evaluation.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-py${{ matrix.python }}
          path: rapport-evaluation.json

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks inspecte l'historique complet, pas seulement le dernier
          # commit : un secret retiré reste exploitable tant qu'il est dans
          # l'historique.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependances:
    name: Vulnerabilites des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # pip fait partie de l'environnement audite. Un pip ancien ferait
      # remonter ses propres avis, sans rapport avec les dependances du
      # projet : le mettre a jour d'abord evite ce bruit.
      - name: Mettre pip a jour
        run: python -m pip install --upgrade pip

      - name: Installer le projet
        run: pip install -e ".[dev]"

      # Bloque des qu'une NOUVELLE vulnerabilite apparait dans une dependance.
      #
      # PYSEC-2026-2447 (CVE-2025-69872) est ecarte explicitement, apres
      # evaluation et non par confort :
      #   · diskcache est une dependance TRANSITIVE, tiree par pySigma ;
      #   · aucune version corrigee n'existe (tout diskcache <= 5.6.3) ;
      #   · l'avis exige un acces en ECRITURE au repertoire de cache
      #     (CVSS 4.0 AV:L/PR:L/UI:A) ;
      #   · pySigma ne l'utilise que dans sigma/data/mitre_attack.py et
      #     mitre_d3fend.py. ARGUS n'importe JAMAIS sigma.data.* — il embarque
      #     son propre corpus ATT&CK. Verifie : diskcache n'est meme pas charge
      #     en memoire pendant l'analyse et la conversion d'une regle Sigma, et
      #     aucun repertoire de cache n'est cree.
      #
      # A retirer des qu'un correctif diskcache est publie.
      - name: Auditer les dependances
        run: pip-audit --ignore-vuln PYSEC-2026-2447

  paquet:
    name: Paquet MCPB distribuable
    runs-on: ubuntu-latest
    needs: qualite

    # Le `.mcpb` est le livrable principal : c'est ce qu'une equipe SOC
    # installe. Le construire seulement a la main, sur un poste, laissait
    # passer des defauts que seule l'execution du paquet revele — dont un
    # plantage de la commande de diagnostic que le destinataire lance en
    # premier. La chaine le construit donc, l'execute, et le publie.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Installer les dependances du depot
        run: pip install -e ".[dev]"

      - name: Installer la CLI d'empaquetage
        run: npm install @anthropic-ai/mcpb

      # Construit, verifie l'ecart avec le code teste, genere le manifeste,
      # empaquette, puis DEPAQUETTE ailleurs et execute le resultat.
      - name: Construire et verifier le paquet
        run: python mcpb/outils/construire.py

      - uses: actions/upload-artifact@v4
        with:
          name: argus-secops-mcpb
          path: mcpb/dist/*.mcpb
          if-no-files-found: error
