[project]
name = "argus-mcpb"
version = "1.0.0"
description = "ARGUS — plateforme SecOps, 46 outils MCP en lecture seule"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "dnspython>=2.7",
    "cryptography>=42.0",
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    # Analyse et conversion des regles Sigma. L'API a change entre pySigma
    # 0.x et 1.x : le plancher est la version contre laquelle le code est
    # verifie, pas la plus ancienne qui s'installe.
    "pysigma>=1.5",
    "pysigma-backend-kusto>=1.0",
    "pysigma-backend-splunk>=2.1",
    "pysigma-backend-elasticsearch>=2.1",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/argus_bundle",
    "src/argus_net",
    "src/vuln_intel_mcp",
    "src/mitre_mcp",
    "src/detection_mcp",
    "src/web_recon_mcp",
    "src/email_security_mcp",
    "src/threat_intel_mcp",
    "src/entra_secops_mcp",
]
