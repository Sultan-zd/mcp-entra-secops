[project]
name = "argus-mcpb"
version = "1.0.0"
description = "ARGUS — plateforme SecOps, 39 outils MCP en lecture seule"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "dnspython>=2.7",
    "cryptography>=42.0",
    "azure-identity>=1.19",
    "aiohttp>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/argus_bundle",
    "src/argus_net",
    "src/vuln_intel_mcp",
    "src/mitre_mcp",
    "src/web_recon_mcp",
    "src/email_security_mcp",
    "src/threat_intel_mcp",
    "src/entra_secops_mcp",
]
